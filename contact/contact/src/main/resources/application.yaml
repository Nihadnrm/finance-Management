spring:
  application:
    name: contact


  datasource:
    url: jdbc:mysql://localhost:3306/finance_Management
    username: ${USERNAME}
    password: ${PASSWORD}

  jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  cache:
     type: caffeine
     caffeine:
       spec: maximumSize=100,expireAfterWrite=5m

server:
    port: 8083

jwt:
    secret: ${JWT_SECRET}